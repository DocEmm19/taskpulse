# TaskPulse — GitHub Pages deploy workflow
#
# In your repo this file must live at: .github/workflows/deploy.yml
# (that is where it already is inside the handoff zip). Once pushed to your
# GitHub repo, it runs automatically on every push to `main` and publishes
# the web app to GitHub Pages. See SETUP.md for the one-time setup (repo
# Secrets + enabling Pages).
#
# ---------------------------------------------------------------------------
# SETUP — Gaurav, do this once in the GitHub repo before the first deploy:
#
#   1. Settings -> Secrets and variables -> Actions -> "New repository secret"
#      and add BOTH of these (values from your Supabase project settings):
#        - EXPO_PUBLIC_SUPABASE_URL
#        - EXPO_PUBLIC_SUPABASE_ANON_KEY
#   2. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#   3. In app.json, `expo.experiments.baseUrl` MUST match your repo name
#      exactly, e.g. if your repo is `github.com/<you>/taskpulse`, baseUrl
#      must be "/taskpulse/" (leading + trailing slash). If you rename the
#      repo, update baseUrl to match and re-deploy.
#
# After that, every push to `main` (or a manual "Run workflow") builds and
# publishes app/dist to GitHub Pages automatically.
# ---------------------------------------------------------------------------

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a new push cancels an in-flight deploy of an
# older commit rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build web export (SPA + COI service worker + PWA tags + 404 fallback)
        working-directory: app
        env:
          # Pulled from repo Secrets — see SETUP note above. These are
          # public (client-side) values by Supabase's design, but they still
          # live in Secrets so they aren't hardcoded in the repo.
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build:web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
